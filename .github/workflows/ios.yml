name: iOS Build for Appetize & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Simulator (Appetize)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator
        run: flutter build ios --simulator --no-codesign

      - name: Compress Runner.app for Appetize
        run: |
          cd build/ios/iphonesimulator
          zip -r -y ../../../Runner.zip Runner.app

      - name: Upload iOS Simulator Build (for Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: richfarmaci-ios-appetize
          path: Runner.zip
          retention-days: 7

