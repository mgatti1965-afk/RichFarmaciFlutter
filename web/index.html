<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Richiesta farmaci abituali al medico curante">
  <meta name="theme-color" content="#2E7D32">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RichFarmaci">
  <link rel="apple-touch-icon" sizes="180x180" href="/RichFarmaciFlutter/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/RichFarmaciFlutter/icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/RichFarmaciFlutter/icons/Icon-512.png">
  <link rel="apple-touch-icon" href="/RichFarmaciFlutter/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/RichFarmaciFlutter/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="/RichFarmaciFlutter/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RichFarmaci</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F8FAFC;color:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;text-align:center;">
    <div id="loading-spinner" style="width:40px;height:40px;border:4px solid #E2E8F0;border-top-color:#2E7D32;border-radius:50%;animation:rf-spin 0.9s linear infinite;margin-bottom:16px;"></div>
    <div id="loading-text" style="font-size:18px;font-weight:600;">Caricamento RichFarmaci...</div>
    <div id="loading-error" style="display:none;margin-top:16px;max-width:360px;">
      <p style="font-size:15px;color:#B91C1C;margin:0 0 12px 0;">Si è verificato un problema durante l'avvio dell'app.</p>
      <p id="loading-error-detail" style="font-size:12px;color:#475569;word-break:break-word;margin:0 0 16px 0;"></p>
      <button onclick="location.reload()" style="background:#2E7D32;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:600;cursor:pointer;">Ricarica</button>
    </div>
  </div>
  <style>
    @keyframes rf-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      var isDebug = location.search.indexOf('debug=1') !== -1;
      var debugBox = null;
      var debugLogs = [];
      function logDebug(msg) {
        debugLogs.push(String(msg));
        if (isDebug && debugBox) {
          debugBox.textContent = debugLogs.slice(-20).join('\n');
        }
      }
      if (isDebug) {
        debugBox = document.createElement('pre');
        debugBox.id = 'rf-debug-box';
        debugBox.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;max-height:45vh;overflow:auto;z-index:999999;background:rgba(15,23,42,0.92);color:#e2e8f0;font-size:11px;line-height:1.35;padding:10px;border-radius:8px;margin:0;white-space:pre-wrap;word-break:break-word;pointer-events:auto;';
        document.body.appendChild(debugBox);
        logDebug('UA: ' + navigator.userAgent);
        var origErr = console.error;
        console.error = function () {
          logDebug('[console.error] ' + Array.prototype.slice.call(arguments).join(' '));
          return origErr.apply(console, arguments);
        };
      }
      var firstFrame = false;
      function showBootError(msg) {
        logDebug('[bootError] ' + msg);
        if (firstFrame) return;
        var sp = document.getElementById('loading-spinner');
        var tx = document.getElementById('loading-text');
        var er = document.getElementById('loading-error');
        var dt = document.getElementById('loading-error-detail');
        if (sp) sp.style.display = 'none';
        if (tx) tx.textContent = 'RichFarmaci';
        if (dt && msg) dt.textContent = String(msg);
        if (er) er.style.display = 'block';
      }
      window.addEventListener('error', function (e) {
        logDebug('[error] ' + (e.message || (e.error && e.error.message) || 'unknown'));
        showBootError(e.message || (e.error && e.error.message) || 'Errore sconosciuto');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        var m = (r && (r.message || r.toString())) || 'Errore asincrono';
        logDebug('[rejection] ' + m);
        showBootError(m);
      });
      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        logDebug('[event] flutter-first-frame');
        var splash = document.getElementById('loading-splash');
        if (splash) splash.remove();
        setTimeout(function () {
          window.dispatchEvent(new Event('resize'));
          if (isDebug) {
            var fv = document.querySelector('flutter-view');
            var gp = document.querySelector('flt-glass-pane');
            var cv = document.querySelectorAll('canvas');
            var r = fv ? fv.getBoundingClientRect() : (gp ? gp.getBoundingClientRect() : null);
            logDebug('flutter-view=' + !!fv + ' glass-pane=' + !!gp + ' canvases=' + cv.length + (r ? (' rect=' + Math.round(r.width) + 'x' + Math.round(r.height)) : ''));
            if (cv.length > 0) {
              var cr = cv[0].getBoundingClientRect();
              logDebug('canvas0=' + cv[0].width + 'x' + cv[0].height + ' css=' + Math.round(cr.width) + 'x' + Math.round(cr.height));
            }
          }
        }, 500);
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) {
            if (k.indexOf('flutter') !== -1) caches.delete(k);
          });
        }).catch(function () {});
      }
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
