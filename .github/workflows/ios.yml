name: iOS Build for Appetize & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Simulator (Appetize)
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator
        run: flutter build ios --simulator --no-codesign

      - name: Compress Runner.app for Appetize
        run: |
          cd build/ios/iphonesimulator
          zip -r -y ../../../Runner.zip Runner.app

      - name: Upload iOS Simulator Build (for Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: richfarmaci-ios-appetize
          path: Runner.zip
          retention-days: 7

      - name: Publish Direct Public Release for Appetize
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: appetize-latest
          name: "Latest Appetize iOS Build"
          body: "Direct public download URL for Appetize:\nhttps://github.com/mgatti1965-afk/RichFarmaciFlutter/releases/download/appetize-latest/Runner.zip"
          files: Runner.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

